<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Helmryth</title>
  <desc id="desc">A clipped warm-mineral tile carrying a braided Helmryth score mark in ink, vermilion, and petrol.</desc>

  <!--
    Code-native master for every desktop icon. The 824-unit tile follows the
    macOS icon grid while the clipped corners, square staves, and crossed score
    lines reproduce the in-product HelmrythMark geometry without gradients,
    glow, or dark UI styling. Keep build/generate-icons.mjs as the only
    rasterization path.
  -->
  <g>
    <path
      d="M190 100H834L924 190V834L834 924H190L100 834V190Z"
      fill="#F6F1E7"
      stroke="#D6CAB9"
      stroke-width="10"
    />

    <!-- The living score continues behind the mark. -->
    <path d="M174 512H850" fill="none" stroke="#167A78" stroke-width="14" />

    <!-- Canonical HelmrythMark, enlarged from its 32-unit UI geometry. -->
    <g transform="translate(204.8 185.6) scale(19.2)">
      <path
        d="M5 5.5 8 3h5v8.25l6-3.5V3h5l3 2.5v21L24 29h-5v-8.35l-6 3.5V29H8l-3-2.5v-21Z"
        fill="#C44F36"
      />
      <path d="m13 14.6 6-3.5v5.15l-6 3.5V14.6Z" fill="#F6F1E7" />
      <path
        d="M8.25 8.5H13M19 23.5h4.75"
        fill="none"
        stroke="#F6F1E7"
        stroke-width="1.5"
        stroke-linecap="square"
      />
    </g>
  </g>
</svg>
