# Windows installer, built on a real Windows runner and published as a
# workflow artifact.
#
# This stays on a native Windows runner: an NSIS artifact that never ran on
# Windows is not a release candidate. Build it from the same pinned commit as
# the other platforms and attach it to the matching draft.
#
# Deliberately artifact-only: pushing straight to the separate releases
# repo would need a cross-repo token this workflow has no business holding.
name: Package Windows

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit/tag/branch to build (defaults to the branch this is run from)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  package:
    name: NSIS installer
    runs-on: windows-latest
    timeout-minutes: 30
    environment: release-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - name: Fetch protected main and approved release tags
        shell: bash
        run: git fetch --force --prune origin '+refs/heads/main:refs/remotes/origin/main' '+refs/tags/*:refs/tags/*'
      - name: Guard the release source
        shell: bash
        env:
          HELMRYTH_RELEASE_TAG_PUBLIC_KEYS_ASC: ${{ secrets.HELMRYTH_RELEASE_TAG_PUBLIC_KEYS_ASC }}
        run: node scripts/release-source-guard.mjs "${{ inputs.ref || github.ref }}"
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:brand
      # The packaged app ships compiled JS, so stale output must never ride
      # inside an unsigned or unsealed artifact.
      - name: clean build outputs
        shell: bash
        run: rm -rf dist dist-server release
      - name: Package with the explicit release-only update target
        env:
          HELMRYTH_RELEASE_REPO: ${{ vars.HELMRYTH_RELEASE_REPO }}
          HELMRYTH_RELEASE_REGISTRY_ORIGIN: ${{ vars.HELMRYTH_RELEASE_REGISTRY_ORIGIN }}
          HELMRYTH_RELEASE_CONDUIT_ORIGIN: ${{ vars.HELMRYTH_RELEASE_CONDUIT_ORIGIN }}
          HELMRYTH_WINDOWS_CERT_PFX_BASE64: ${{ secrets.HELMRYTH_WINDOWS_CERT_PFX_BASE64 }}
          HELMRYTH_WINDOWS_CERT_PASSWORD: ${{ secrets.HELMRYTH_WINDOWS_CERT_PASSWORD }}
          HELMRYTH_WINDOWS_PUBLISHER_NAME: ${{ vars.HELMRYTH_WINDOWS_PUBLISHER_NAME }}
          HELMRYTH_WINDOWS_TIMESTAMP_SERVER: ${{ vars.HELMRYTH_WINDOWS_TIMESTAMP_SERVER }}
        run: pnpm package:release:win
      - name: report what was built
        shell: bash
        run: |
          echo "version: $(node -p "require('./package.json').version")"
          echo "commit:  $(git rev-parse HEAD)"
          ls -lh release/*.exe release/*.yml 2>/dev/null || true
      # Three things silently produce an installer that builds fine and is
      # broken in the field, and none of them can be checked from the Mac the
      # release is cut on — the artifact carries only the .exe. So assert them
      # here, where the unpacked tree exists, and fail the build instead of
      # shipping it.
      - name: verify the packaged tree
        shell: bash
        env:
          HELMRYTH_RELEASE_REPO: ${{ vars.HELMRYTH_RELEASE_REPO }}
          HELMRYTH_RELEASE_REGISTRY_ORIGIN: ${{ vars.HELMRYTH_RELEASE_REGISTRY_ORIGIN }}
          HELMRYTH_RELEASE_CONDUIT_ORIGIN: ${{ vars.HELMRYTH_RELEASE_CONDUIT_ORIGIN }}
          HELMRYTH_WINDOWS_PUBLISHER_NAME: ${{ vars.HELMRYTH_WINDOWS_PUBLISHER_NAME }}
        run: |
          res=release/win-unpacked/resources
          fail=0
          # Missing server code leaves the desktop shell unable to start.
          [ -f "$res/server/index.js" ] || { echo "::error::missing $res/server/index.js"; fail=1; }
          # Missing UI output leaves the desktop shell unable to render.
          [ -f "$res/ui/index.html" ] || { echo "::error::missing $res/ui/index.html"; fail=1; }
          [ -f "$res/cloudflared/cloudflared.exe" ] || {
            echo "::error::missing $res/cloudflared/cloudflared.exe"; fail=1; }
          [ -f "$res/licenses/cloudflared-LICENSE.txt" ] || {
            echo "::error::missing cloudflared Apache 2.0 license"; fail=1; }
          [ -f "$res/licenses/cloudflared-README.md" ] || {
            echo "::error::missing cloudflared release provenance"; fail=1; }
          if [ -f "$res/cloudflared/cloudflared.exe" ]; then
            expected=c29eee2b121f5436a642eed69fd9767da7e7b8c510fa50aaa130337f931357b5
            actual=$(sha256sum "$res/cloudflared/cloudflared.exe" | cut -d' ' -f1)
            [ "$actual" = "$expected" ] || {
              echo "::error::packaged cloudflared hash is $actual"; fail=1; }
            "$res/cloudflared/cloudflared.exe" version | grep -Fq "cloudflared version 2026.8.2 " || {
              echo "::error::packaged cloudflared has the wrong version"; fail=1; }
          fi
          [ -f "$res/app-update.yml" ] || { echo "::error::missing $res/app-update.yml"; fail=1; }
          if [ -f "$res/app-update.yml" ]; then
            if [ -z "${HELMRYTH_RELEASE_REPO:-}" ]; then
              echo "::error::Set repository variable HELMRYTH_RELEASE_REPO to owner/repo before packaging Windows updates"; fail=1
            elif ! node scripts/verify-update-target.mjs "$res/app-update.yml" --signed; then
              fail=1
            fi
          fi
          [ -f "$res/helmryth-service-config.json" ] || {
            echo "::error::missing $res/helmryth-service-config.json"; fail=1; }
          if [ -f "$res/helmryth-service-config.json" ] &&
             ! node scripts/verify-managed-service-config.mjs "$res/helmryth-service-config.json"; then
            fail=1
          fi
          echo "--- app-update.yml ---"; cat "$res/app-update.yml" 2>/dev/null || true
          exit $fail
      - name: verify Authenticode signatures
        shell: pwsh
        env:
          HELMRYTH_WINDOWS_PUBLISHER_NAME: ${{ vars.HELMRYTH_WINDOWS_PUBLISHER_NAME }}
        run: |
          $raw = $env:HELMRYTH_WINDOWS_PUBLISHER_NAME.Trim()
          if (-not $raw) { throw "Missing HELMRYTH_WINDOWS_PUBLISHER_NAME" }
          if ($raw.StartsWith("[")) {
            $expectedNames = @(ConvertFrom-Json $raw)
          } else {
            $expectedNames = @($raw)
          }
          $targets = @(
            (Get-ChildItem 'release/Helmryth-*-setup.exe').FullName,
            (Resolve-Path 'release/win-unpacked/Helmryth.exe').Path
          )
          foreach ($target in $targets) {
            $signature = Get-AuthenticodeSignature $target
            if ($signature.Status -ne 'Valid') {
              throw "$target Authenticode status is $($signature.Status)"
            }
            if ($null -eq $signature.SignerCertificate) {
              throw "$target is missing a signer certificate"
            }
            if ($expectedNames -notcontains $signature.SignerCertificate.Subject) {
              throw "$target signer subject $($signature.SignerCertificate.Subject) is not in the approved publisher identity list"
            }
          }

      # Existing is not the same as running. Start the packaged server where
      # node_modules genuinely is not present and prove its health endpoint.
      - name: start the packaged server
        shell: bash
        run: |
          res=release/win-unpacked/resources
          HOME="$RUNNER_TEMP/hry-smoke" USERPROFILE="$RUNNER_TEMP/hry-smoke" \
            HELMRYTH_PORT=21987 node "$res/server/index.js" > "$RUNNER_TEMP/server.log" 2>&1 &
          pid=$!
          for _ in $(seq 1 90); do
            if curl -fsS --max-time 2 http://127.0.0.1:21987/api/health >/dev/null 2>&1; then
              echo "packaged server answered /api/health ✓"
              kill $pid 2>/dev/null || true
              exit 0
            fi
            kill -0 $pid 2>/dev/null || break
            sleep 1
          done
          echo "::error::the packaged server never served /api/health"
          cat "$RUNNER_TEMP/server.log" || true
          kill $pid 2>/dev/null || true
          exit 1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: helmryth-windows-installer
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 14
