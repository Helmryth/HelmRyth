# One-button releases: builds macOS (arm64 + x64, signed, notarized, stapled),
# Windows, and Ubuntu from ONE commit, assembles a complete draft on the
# explicitly configured Helmryth release repository with verified feeds, and publishes after a human
# approves the draft.
#
# Every gate below blocks a known class of broken release:
#   - clean output dirs        -> stale build output can break the app seal
#   - codesign gate BEFORE     -> notarization ACCEPTS invalid signatures
#   - packaged-server smoke    -> unresolved runtime imports can die on launch
#   - proxy-path probe         -> helper paths can fail while health stays green
#   - staple, THEN hash        -> stapling rewrites bytes; stale feeds make
#                                 electron-updater reject every update
#   - blockmap regeneration    -> stale differential maps waste every updater's
#                                 bandwidth silently
#   - assemble-then-publish    -> partial platform releases strand download links
#
# One-time setup (repo secrets) is documented in docs/releasing.md.
name: Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit/tag/branch to release (defaults to the branch this runs from)"
        required: false
        type: string
      publish:
        description: "Publish immediately after assembly (otherwise leave a draft for review)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prepare:
    name: Pin the release commit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release-production
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
      version: ${{ steps.pin.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - name: Fetch protected main and approved release tags
        run: git fetch --force --prune origin '+refs/heads/main:refs/remotes/origin/main' '+refs/tags/*:refs/tags/*'
      - name: Guard the release source
        env:
          HELMRYTH_RELEASE_TAG_PUBLIC_KEYS_ASC: ${{ secrets.HELMRYTH_RELEASE_TAG_PUBLIC_KEYS_ASC }}
        run: node scripts/release-source-guard.mjs "${{ inputs.ref || github.ref }}"
      - id: pin
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Reject authored brand residue
        run: node scripts/check-brand-residue.mjs
      - name: Require Helmryth release configuration
        env:
          HELMRYTH_RELEASE_REPO: ${{ vars.HELMRYTH_RELEASE_REPO }}
          HELMRYTH_RELEASE_REGISTRY_ORIGIN: ${{ vars.HELMRYTH_RELEASE_REGISTRY_ORIGIN }}
          HELMRYTH_RELEASE_CONDUIT_ORIGIN: ${{ vars.HELMRYTH_RELEASE_CONDUIT_ORIGIN }}
          HELMRYTH_RELEASES_PAT: ${{ secrets.HELMRYTH_RELEASES_PAT }}
        run: |
          node scripts/release-builder-config.mjs --check
          [ -n "${HELMRYTH_RELEASES_PAT:-}" ] || {
            echo "::error::Set secret HELMRYTH_RELEASES_PAT before running the release lane"; exit 1; }
      - name: Refuse to overwrite a published release
        env:
          GH_TOKEN: ${{ secrets.HELMRYTH_RELEASES_PAT }}
          HELMRYTH_RELEASE_REPO: ${{ vars.HELMRYTH_RELEASE_REPO }}
        run: |
          v="v$(node -p "require('./package.json').version")"
          if gh release view "$v" --repo "$HELMRYTH_RELEASE_REPO" --json isDraft --jq .isDraft 2>/dev/null | grep -q false; then
            echo "::error::$v is already published on $HELMRYTH_RELEASE_REPO — bump the version first"
            exit 1
          fi

  mac:
    name: macOS arm64 + x64 (sign, notarize, staple)
    needs: prepare
    runs-on: macos-14
    timeout-minutes: 90
    environment: release-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Clean generated output
        run: rm -rf dist dist-server dist-native release

      - name: Import the Developer ID certificate into a throwaway keychain
        env:
          HELMRYTH_MAC_CERT_P12_BASE64: ${{ secrets.HELMRYTH_MAC_CERT_P12_BASE64 }}
          HELMRYTH_MAC_CERT_PASSWORD: ${{ secrets.HELMRYTH_MAC_CERT_PASSWORD }}
        run: |
          [ -n "${HELMRYTH_MAC_CERT_P12_BASE64:-}" ] || { echo "::error::Missing HELMRYTH_MAC_CERT_P12_BASE64"; exit 1; }
          [ -n "${HELMRYTH_MAC_CERT_PASSWORD:-}" ] || { echo "::error::Missing HELMRYTH_MAC_CERT_PASSWORD"; exit 1; }
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$HELMRYTH_MAC_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$HELMRYTH_MAC_CERT_PASSWORD" -A \
            -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          rm "$RUNNER_TEMP/cert.p12"

      - name: Package both architectures with the explicit update target
        env:
          HELMRYTH_RELEASE_REPO: ${{ vars.HELMRYTH_RELEASE_REPO }}
          HELMRYTH_RELEASE_REGISTRY_ORIGIN: ${{ vars.HELMRYTH_RELEASE_REGISTRY_ORIGIN }}
          HELMRYTH_RELEASE_CONDUIT_ORIGIN: ${{ vars.HELMRYTH_RELEASE_CONDUIT_ORIGIN }}
        run: pnpm package:release:mac

      - name: "Gate: the signature must verify BEFORE notarization"
        env:
          HELMRYTH_RELEASE_REPO: ${{ vars.HELMRYTH_RELEASE_REPO }}
          HELMRYTH_RELEASE_REGISTRY_ORIGIN: ${{ vars.HELMRYTH_RELEASE_REGISTRY_ORIGIN }}
          HELMRYTH_RELEASE_CONDUIT_ORIGIN: ${{ vars.HELMRYTH_RELEASE_CONDUIT_ORIGIN }}
        run: |
          for app in release/mac-arm64/Helmryth.app release/mac/Helmryth.app; do
            codesign --verify --deep --strict "$app"
            bin="$app/Contents/Resources/cloudflared/cloudflared"
            test -x "$bin" || { echo "::error::missing executable $bin"; exit 1; }
            test -f "$app/Contents/Resources/licenses/cloudflared-LICENSE.txt" \
              || { echo "::error::missing cloudflared license in $app"; exit 1; }
            test -f "$app/Contents/Resources/licenses/cloudflared-README.md" \
              || { echo "::error::missing cloudflared provenance in $app"; exit 1; }
            node scripts/verify-update-target.mjs "$app/Contents/Resources/app-update.yml"
            node scripts/verify-managed-service-config.mjs "$app/Contents/Resources/helmryth-service-config.json"
            codesign --verify --strict "$bin"
            app_team=$(codesign -dv --verbose=4 "$app" 2>&1 | sed -n 's/^TeamIdentifier=//p')
            bin_team=$(codesign -dv --verbose=4 "$bin" 2>&1 | sed -n 's/^TeamIdentifier=//p')
            test -n "$app_team" && test "$bin_team" = "$app_team" || {
              echo "::error::cloudflared is not signed by the app's Developer ID team in $app"; exit 1; }
            echo "ok: $app"
          done

      - name: "Gate: both packaged servers start and every helper path resolves"
        run: |
          for app in release/mac-arm64/Helmryth.app release/mac/Helmryth.app; do
            res="$app/Contents/Resources"
            # the server tree is plain JS — runnable on the runner's node
            # regardless of the app binary's arch
            HELMRYTH_SMOKE_DIST="$res/server" node scripts/smoke-packaged-server.mjs \
              || { echo "::error::packaged server in $app failed to start"; exit 1; }
            node --input-type=module - "$res/server" <<'EOF'
          import { existsSync } from "node:fs";
          import { pathToFileURL } from "node:url";
          const server = process.argv[2];
          const { SPAWNED_PROXIES } = await import(pathToFileURL(`${server}/proxy-paths.js`));
          const missing = Object.entries(SPAWNED_PROXIES).filter(([, p]) => !existsSync(p));
          if (missing.length) {
            console.error("unresolved proxies:", missing);
            process.exit(1);
          }
          console.log(`ok: ${Object.keys(SPAWNED_PROXIES).length} proxies resolve in ${server}`);
          EOF
            for bin in "$res/cua-driver" "$res/Helmryth Speech.app/Contents/MacOS/speech-helper"; do
              lipo -archs "$bin" | grep -q "x86_64" || { echo "::error::$bin lacks x86_64"; exit 1; }
              lipo -archs "$bin" | grep -q "arm64" || { echo "::error::$bin lacks arm64"; exit 1; }
            done
            cloudflared="$res/cloudflared/cloudflared"
            expected_arch=x86_64
            case "$app" in *mac-arm64*) expected_arch=arm64 ;; esac
            test "$(lipo -archs "$cloudflared")" = "$expected_arch" || {
              echo "::error::$cloudflared is not the expected $expected_arch executable"; exit 1; }
            if [ "$(uname -m)" = "$expected_arch" ]; then
              "$cloudflared" version | grep -Fq "cloudflared version 2026.8.2 " || {
                echo "::error::$cloudflared has the wrong version"; exit 1; }
            fi
          done

      - name: Notarize all four artifacts
        env:
          HELMRYTH_APPLE_API_KEY_P8_BASE64: ${{ secrets.HELMRYTH_APPLE_API_KEY_P8_BASE64 }}
          HELMRYTH_APPLE_API_KEY_ID: ${{ secrets.HELMRYTH_APPLE_API_KEY_ID }}
          HELMRYTH_APPLE_API_ISSUER_ID: ${{ secrets.HELMRYTH_APPLE_API_ISSUER_ID }}
        run: |
          [ -n "${HELMRYTH_APPLE_API_KEY_P8_BASE64:-}" ] || { echo "::error::Missing HELMRYTH_APPLE_API_KEY_P8_BASE64"; exit 1; }
          [ -n "${HELMRYTH_APPLE_API_KEY_ID:-}" ] || { echo "::error::Missing HELMRYTH_APPLE_API_KEY_ID"; exit 1; }
          [ -n "${HELMRYTH_APPLE_API_ISSUER_ID:-}" ] || { echo "::error::Missing HELMRYTH_APPLE_API_ISSUER_ID"; exit 1; }
          echo "$HELMRYTH_APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          for f in release/*.dmg release/*.zip; do
            out=$(xcrun notarytool submit "$f" \
              --key "$RUNNER_TEMP/notary.p8" \
              --key-id "$HELMRYTH_APPLE_API_KEY_ID" \
              --issuer "$HELMRYTH_APPLE_API_ISSUER_ID" \
              --wait 2>&1)
            echo "$out" | tail -2
            echo "$out" | grep -q "status: Accepted" || { echo "::error::notarization not Accepted for $f"; exit 1; }
          done
          rm "$RUNNER_TEMP/notary.p8"

      - name: Staple, re-zip, regenerate blockmaps and the feed
        run: |
          xcrun stapler staple release/Helmryth-*-arm64.dmg
          xcrun stapler staple release/Helmryth-*-x64.dmg
          xcrun stapler staple release/mac-arm64/Helmryth.app
          xcrun stapler staple release/mac/Helmryth.app
          v=$(node -p "require('./package.json').version")
          rm -f "release/Helmryth-$v-arm64.zip" "release/Helmryth-$v-x64.zip"
          ditto -c -k --sequesterRsrc --keepParent release/mac-arm64/Helmryth.app "release/Helmryth-$v-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent release/mac/Helmryth.app "release/Helmryth-$v-x64.zip"
          node scripts/regenerate-blockmaps.mjs \
            "release/Helmryth-$v-arm64.zip" "release/Helmryth-$v-x64.zip" \
            "release/Helmryth-$v-arm64.dmg" "release/Helmryth-$v-x64.dmg"
          # refreshes every hash from the post-staple bytes and refuses to
          # finish unless the feed matches the files on disk
          node scripts/regenerate-mac-feed.mjs

      - name: Stable-named copies for the README's /latest/download links
        run: |
          v=$(node -p "require('./package.json').version")
          cp "release/Helmryth-$v-arm64.dmg" release/Helmryth.dmg
          cp "release/Helmryth-$v-x64.dmg" release/Helmryth-intel.dmg

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mac-release
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows x64
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 30
    environment: release-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Clean generated output
        shell: bash
        run: rm -rf dist dist-server release
      - name: Package with the explicit update target
        env:
          HELMRYTH_RELEASE_REPO: ${{ vars.HELMRYTH_RELEASE_REPO }}
          HELMRYTH_RELEASE_REGISTRY_ORIGIN: ${{ vars.HELMRYTH_RELEASE_REGISTRY_ORIGIN }}
          HELMRYTH_RELEASE_CONDUIT_ORIGIN: ${{ vars.HELMRYTH_RELEASE_CONDUIT_ORIGIN }}
          HELMRYTH_WINDOWS_CERT_PFX_BASE64: ${{ secrets.HELMRYTH_WINDOWS_CERT_PFX_BASE64 }}
          HELMRYTH_WINDOWS_CERT_PASSWORD: ${{ secrets.HELMRYTH_WINDOWS_CERT_PASSWORD }}
          HELMRYTH_WINDOWS_PUBLISHER_NAME: ${{ vars.HELMRYTH_WINDOWS_PUBLISHER_NAME }}
          HELMRYTH_WINDOWS_TIMESTAMP_SERVER: ${{ vars.HELMRYTH_WINDOWS_TIMESTAMP_SERVER }}
        run: pnpm package:release:win
      - name: Verify the packaged tree and start the packaged server
        shell: bash
        env:
          HELMRYTH_RELEASE_REPO: ${{ vars.HELMRYTH_RELEASE_REPO }}
          HELMRYTH_RELEASE_REGISTRY_ORIGIN: ${{ vars.HELMRYTH_RELEASE_REGISTRY_ORIGIN }}
          HELMRYTH_RELEASE_CONDUIT_ORIGIN: ${{ vars.HELMRYTH_RELEASE_CONDUIT_ORIGIN }}
          HELMRYTH_WINDOWS_PUBLISHER_NAME: ${{ vars.HELMRYTH_WINDOWS_PUBLISHER_NAME }}
        run: |
          res=release/win-unpacked/resources
          [ -f "$res/server/index.js" ] || { echo "::error::missing server/index.js"; exit 1; }
          [ -f "$res/ui/index.html" ] || { echo "::error::missing ui/index.html"; exit 1; }
          [ -f "$res/cloudflared/cloudflared.exe" ] || { echo "::error::missing cloudflared.exe"; exit 1; }
          [ -f "$res/licenses/cloudflared-LICENSE.txt" ] || { echo "::error::missing cloudflared license"; exit 1; }
          [ -f "$res/licenses/cloudflared-README.md" ] || { echo "::error::missing cloudflared provenance"; exit 1; }
          expected=c29eee2b121f5436a642eed69fd9767da7e7b8c510fa50aaa130337f931357b5
          actual=$(sha256sum "$res/cloudflared/cloudflared.exe" | cut -d' ' -f1)
          [ "$actual" = "$expected" ] || { echo "::error::cloudflared hash is $actual"; exit 1; }
          "$res/cloudflared/cloudflared.exe" version | grep -Fq "cloudflared version 2026.8.2 " || {
            echo "::error::cloudflared has the wrong version"; exit 1; }
          [ -f "$res/app-update.yml" ] || { echo "::error::missing app-update.yml"; exit 1; }
          node scripts/verify-update-target.mjs "$res/app-update.yml" --signed
          node scripts/verify-managed-service-config.mjs "$res/helmryth-service-config.json"
          HOME="$RUNNER_TEMP/smoke" USERPROFILE="$RUNNER_TEMP/smoke" HELMRYTH_PORT=21987 \
            node "$res/server/index.js" > "$RUNNER_TEMP/server.log" 2>&1 &
          pid=$!
          for _ in $(seq 1 90); do
            curl -fsS --max-time 2 http://127.0.0.1:21987/api/health >/dev/null 2>&1 && { kill $pid; exit 0; }
            kill -0 $pid 2>/dev/null || break
            sleep 1
          done
          echo "::error::the packaged server never served /api/health"
          cat "$RUNNER_TEMP/server.log" || true
          exit 1
      - name: Verify Authenticode signatures
        shell: pwsh
        env:
          HELMRYTH_WINDOWS_PUBLISHER_NAME: ${{ vars.HELMRYTH_WINDOWS_PUBLISHER_NAME }}
        run: |
          $raw = $env:HELMRYTH_WINDOWS_PUBLISHER_NAME.Trim()
          if (-not $raw) { throw "Missing HELMRYTH_WINDOWS_PUBLISHER_NAME" }
          if ($raw.StartsWith("[")) {
            $expectedNames = @(ConvertFrom-Json $raw)
          } else {
            $expectedNames = @($raw)
          }
          $targets = @(
            (Get-ChildItem 'release/Helmryth-*-setup.exe').FullName,
            (Resolve-Path 'release/win-unpacked/Helmryth.exe').Path
          )
          foreach ($target in $targets) {
            $signature = Get-AuthenticodeSignature $target
            if ($signature.Status -ne 'Valid') {
              throw "$target Authenticode status is $($signature.Status)"
            }
            if ($null -eq $signature.SignerCertificate) {
              throw "$target is missing a signer certificate"
            }
            if ($expectedNames -notcontains $signature.SignerCertificate.Subject) {
              throw "$target signer subject $($signature.SignerCertificate.Subject) is not in the approved publisher identity list"
            }
          }
      - name: Stable-named copy
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          cp "release/Helmryth-$v-setup.exe" release/Helmryth-setup.exe
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Ubuntu 24.04 x64
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: release-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install package validation and native smoke tools
        run: >-
          sudo apt-get update && sudo apt-get install -y
          at-spi2-core dbus-x11 desktop-file-utils libxi6 libxkbcommon0 squashfs-tools x11-utils xdotool xvfb
      - run: pnpm install --frozen-lockfile
      - name: Clean generated output
        run: pnpm clean
      - name: Stage the pinned CUA runtime
        run: pnpm build:cua:linux
      - name: Prove overlay-free X11 input routing
        run: dbus-run-session -- xvfb-run -a pnpm smoke:cua-x11-input
      - name: Package with the explicit update target
        env:
          HELMRYTH_RELEASE_REPO: ${{ vars.HELMRYTH_RELEASE_REPO }}
          HELMRYTH_RELEASE_REGISTRY_ORIGIN: ${{ vars.HELMRYTH_RELEASE_REGISTRY_ORIGIN }}
          HELMRYTH_RELEASE_CONDUIT_ORIGIN: ${{ vars.HELMRYTH_RELEASE_CONDUIT_ORIGIN }}
        run: pnpm package:release:linux
      - name: Verify package contents and metadata
        run: node scripts/verify-linux-package.mjs
      - name: Verify the packaged update target
        env:
          HELMRYTH_RELEASE_REPO: ${{ vars.HELMRYTH_RELEASE_REPO }}
          HELMRYTH_RELEASE_REGISTRY_ORIGIN: ${{ vars.HELMRYTH_RELEASE_REGISTRY_ORIGIN }}
          HELMRYTH_RELEASE_CONDUIT_ORIGIN: ${{ vars.HELMRYTH_RELEASE_CONDUIT_ORIGIN }}
        run: node scripts/verify-update-target.mjs release/linux-unpacked/resources/app-update.yml
      - name: Verify the signed managed-services config
        env:
          HELMRYTH_RELEASE_REGISTRY_ORIGIN: ${{ vars.HELMRYTH_RELEASE_REGISTRY_ORIGIN }}
          HELMRYTH_RELEASE_CONDUIT_ORIGIN: ${{ vars.HELMRYTH_RELEASE_CONDUIT_ORIGIN }}
        run: node scripts/verify-managed-service-config.mjs release/linux-unpacked/resources/helmryth-service-config.json
      - name: Match a normal Ubuntu package parent on the ephemeral runner
        run: |
          test ! -L /opt
          test "$(stat -c '%F %U:%G' /opt)" = "directory root:root"
          case "$(stat -c '%a' /opt)" in
            755) ;;
            775|777) sudo chmod 0755 /opt ;;
            *) echo "Unexpected /opt mode: $(stat -c '%a' /opt)" >&2; exit 1 ;;
          esac
          test "$(stat -c '%U:%G %a' /opt)" = "root:root 755"
      - name: Reproduce and verify an in-place DEB upgrade
        run: |
          deb=(release/*.deb)
          test "${#deb[@]}" -eq 1
          sudo --preserve-env=CI,RUNNER_TEMP node scripts/smoke-deb-upgrade.mjs "${deb[0]}"
      - name: Configure Chromium sandbox for the unpacked app
        run: |
          sudo chown root:root release/linux-unpacked/chrome-sandbox
          sudo chmod 4755 release/linux-unpacked/chrome-sandbox
          test "$(stat -c '%U:%G %a' release/linux-unpacked/chrome-sandbox)" = "root:root 4755"
      - name: Smoke the packages
        env:
          HELMRYTH_KEEP_SMOKE_DIR: "1"
          HELMRYTH_SMOKE_INSTALLED_DEB: "1"
        run: pnpm smoke:linux-package
      - name: Remove the installed upgrade fixture
        if: always()
        run: sudo dpkg --purge helmryth || true
      - name: Stable-named copies and checksums
        run: |
          v=$(node -p "require('./package.json').version")
          cp "release/Helmryth-$v-amd64.deb" release/Helmryth-amd64.deb
          cp "release/Helmryth-$v-x86_64.AppImage" release/Helmryth.AppImage
          (cd release && sha256sum "Helmryth-$v-amd64.deb" "Helmryth-$v-x86_64.AppImage" > SHA256SUMS-ubuntu-x64.txt)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-release
          path: |
            release/*.deb
            release/*.AppImage
            release/SHA256SUMS-ubuntu-x64.txt
            release/latest-linux.yml
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: Assemble the draft and verify every feed
    needs: [prepare, mac, windows, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release-production
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: assets
          merge-multiple: true
      - name: Verify every feed hash against the actual bytes
        run: |
          cd assets
          node --input-type=module - <<'EOF'
          import { createHash } from "node:crypto";
          import { readFileSync, readdirSync, statSync, existsSync } from "node:fs";
          const sha512 = (f) => createHash("sha512").update(readFileSync(f)).digest("base64");
          let bad = 0;
          for (const feed of ["latest-mac.yml", "latest.yml", "latest-linux.yml"]) {
            if (!existsSync(feed)) continue;
            const text = readFileSync(feed, "utf8");
            for (const [, url, hash, size] of text.matchAll(/url:\s+(\S+)[\s\S]*?sha512:\s+(\S+)\n\s+size:\s+(\d+)/g)) {
              if (!existsSync(url)) { console.error(`MISSING ${url} (listed in ${feed})`); bad++; continue; }
              const okHash = sha512(url) === hash;
              const okSize = statSync(url).size === Number(size);
              if (!okHash || !okSize) { console.error(`MISMATCH ${url} in ${feed}`); bad++; }
              else console.log(`ok ${url}`);
            }
          }
          if (bad) process.exit(1);
          console.log(`\nall feeds verified; ${readdirSync(".").length} assets staged`);
          EOF
      - name: Create or update the draft with the complete asset set
        env:
          GH_TOKEN: ${{ secrets.HELMRYTH_RELEASES_PAT }}
          HELMRYTH_RELEASE_REPO: ${{ vars.HELMRYTH_RELEASE_REPO }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          cd assets
          tag="v$VERSION"
          if ! gh release view "$tag" --repo "$HELMRYTH_RELEASE_REPO" > /dev/null 2>&1; then
            gh release create "$tag" --repo "$HELMRYTH_RELEASE_REPO" \
              --draft --title "Helmryth $VERSION" \
              --notes "Draft assembled by the Helmryth release workflow from ${GITHUB_REPOSITORY}@$SHA. Edit these notes, then publish."
          fi
          for f in *; do
            gh release upload "$tag" "$f" --repo "$HELMRYTH_RELEASE_REPO" --clobber
          done
          echo "asset count: $(gh release view "$tag" --repo "$HELMRYTH_RELEASE_REPO" --json assets --jq '.assets | length')"

      - name: Publish (only when asked to)
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.HELMRYTH_RELEASES_PAT }}
          HELMRYTH_RELEASE_REPO: ${{ vars.HELMRYTH_RELEASE_REPO }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release edit "v$VERSION" --repo "$HELMRYTH_RELEASE_REPO" --draft=false --latest
          # Verify the remote state rather than trusting the edit command.
          gh release view "v$VERSION" --repo "$HELMRYTH_RELEASE_REPO" --json isDraft --jq .isDraft | grep -q false
          echo "v$VERSION is live"
